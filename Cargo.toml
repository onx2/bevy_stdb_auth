[package]
name = "bevy_stdb_auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A Bevy-native integration for the SpacetimeAuth issuer."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/onx2/bevy_stdb_auth"
homepage = "https://github.com/onx2/bevy_stdb_auth"
documentation = "https://docs.rs/bevy_stdb_auth"
keywords = ["bevy", "authentication", "ecs", "auth", "token"]
categories = ["game-development"]
exclude = [
    "examples/",
    ".github/",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
bevy_app = "0.18"
bevy_ecs = "0.18"
bevy_tasks = "0.18"
bevy_time = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
url = { version = "2.5" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form"] }

# Browser dependencies
js-sys = { version = "0.3", optional = true, default-features = false }
web-sys = { version = "0.3", optional = true, default-features = false, features = [
    "Window",
    "Location",
    "History",
    "Storage",
] }

# OIDC dependencies
oauth2 = { version = "5.0", optional = true, default-features = false }
keyring = { version = "3.6", optional = true, features = ["linux-native-sync-persistent", "apple-native", "windows-native"] }
webbrowser = { version = "1", optional = true }

# Steam dependencies
steamworks = { version = "0.13", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = ["oidc"]

browser = [
    "dep:js-sys",
    "dep:web-sys",
]
oidc = [
    "dep:oauth2",
    "dep:keyring",
    "dep:webbrowser",
]
steam = [
    "dep:steamworks",
    "dep:hex",
]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
