[package]
name = "bevy_stdb_auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A Bevy-native integration for the SpacetimeAuth issuer."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/onx2/bevy_stdb_auth"
homepage = "https://github.com/onx2/bevy_stdb_auth"
documentation = "https://docs.rs/bevy_stdb_auth"
keywords = ["bevy", "authentication", "ecs", "auth", "token"]
categories = ["game-development"]
exclude = [
    ".github/",
]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "oidc"
path = "examples/oidc/main.rs"
required-features = ["oidc"]

[[example]]
name = "steam"
path = "examples/steam/main.rs"
required-features = ["steam"]

[dependencies]
bevy_app = "0.18"
bevy_ecs = "0.18"
bevy_tasks = "0.18"
bevy_time = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2.0" }
url = { version = "2.5" }

oauth2 = { version = "5.0", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true, default-features = false }
web-sys = { version = "0.3", optional = true, default-features = false, features = [
    "Window",
    "Location",
    "History",
    "Storage",
] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "default-tls"] }
webbrowser = { version = "1.2", optional = true }
steamworks = { version = "0.13", optional = true }
hex = { version = "0.4", optional = true }
keyring-core = { version = "1.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", optional = true, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", optional = true, features = ["rt-async-io-crypto-rust"] }

[features]
default = ["oidc"]

browser = [
    "dep:js-sys",
    "dep:web-sys",
]
oidc = [
    "dep:oauth2",
    "dep:webbrowser",
]
steam = [
    "dep:steamworks",
    "dep:hex",
]
persistence = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[package.metadata.docs.rs]
features = ["oidc"]
rustdoc-args = ["--cfg", "docsrs"]
