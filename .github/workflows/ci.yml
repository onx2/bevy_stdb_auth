name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  native:
    name: Native default (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --all-targets --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build docs
        run: cargo doc --no-deps --locked

  browser:
    name: Browser wasm
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features oidc,browser --locked

      - name: Run clippy
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features oidc,browser --locked -- -D warnings

      - name: Build docs
        run: cargo doc --target wasm32-unknown-unknown --no-deps --no-default-features --features oidc,browser --locked

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check OIDC-only native build
        run: cargo check --no-default-features --features oidc --locked

      - name: Check Steam-only native build
        run: cargo check --no-default-features --features steam --locked

      - name: Check OIDC persistence native build
        run: cargo check --no-default-features --features oidc,persistence --locked

      - name: Check native all-features build
        run: cargo check --all-features --locked

      - name: Run all-features clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Install keyring dep for linux, used in OIDC auth
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check crate on MSRV
        run: cargo check --all-targets --all-features --locked
